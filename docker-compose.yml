version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "7024:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      - MYSQL_HOST=db 
      - MYSQL_USERNAME=${MYSQL_USERNAME:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-your_secure_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-starwars_website}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-your_secure_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-starwars_website}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data: